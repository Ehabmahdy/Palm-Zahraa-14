<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمارة 14 بالم الزهراء - إدارة الصيانة 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --primary-light: #2563a8;
    --accent: #c9a227;
    --accent-light: #f0c842;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --neutral: #f8f9fa;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 4px 24px rgba(26,58,92,0.10);
    --shadow-lg: 0 8px 40px rgba(26,58,92,0.15);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #e8eef6 100%);
    min-height: 100vh;
    color: var(--text);
    direction: rtl;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, #0f2744 100%);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: var(--primary);
    box-shadow: 0 4px 12px rgba(201,162,39,0.4);
    flex-shrink: 0;
  }
  .header-text h1 { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
  .header-text p { font-size: 0.82rem; opacity: 0.75; margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn-admin {
    background: var(--accent);
    color: var(--primary);
    border: none;
    padding: 9px 18px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
    box-shadow: 0 2px 10px rgba(201,162,39,0.3);
  }
  .btn-admin:hover { background: var(--accent-light); transform: translateY(-1px); }
  .admin-badge {
    background: rgba(201,162,39,0.2);
    border: 1px solid rgba(201,162,39,0.4);
    color: var(--accent-light);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 5px;
  }
  .admin-badge.active { display: flex; }

  /* MONTH TABS */
  .month-nav {
    background: var(--primary);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .month-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .month-nav-inner::-webkit-scrollbar { display: none; }
  .month-tab {
    padding: 12px 16px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    position: relative;
  }
  .month-tab:hover { color: rgba(255,255,255,0.9); }
  .month-tab.active {
    color: var(--accent-light);
    border-bottom-color: var(--accent);
  }
  .month-tab .paid-dot {
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* MAIN */
  .main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* SUMMARY CARDS */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px; height: 100%;
  }
  .summary-card.blue::before { background: var(--primary-light); }
  .summary-card.green::before { background: var(--success); }
  .summary-card.red::before { background: var(--danger); }
  .summary-card.gold::before { background: var(--accent); }
  .summary-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
  .summary-value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .summary-value.blue { color: var(--primary-light); }
  .summary-value.green { color: var(--success); }
  .summary-value.red { color: var(--danger); }
  .summary-value.gold { color: var(--accent); }
  .summary-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

  /* CONTENT AREA */
  .content-area { display: grid; grid-template-columns: 1fr; gap: 20px; }

  /* TENANT TABLE */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #f8fafc, #f1f5f9);
  }
  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 1.2rem; }

  /* TENANT ROWS */
  .tenant-table { width: 100%; border-collapse: collapse; }
  .tenant-table thead tr {
    background: linear-gradient(135deg, var(--primary), #1e4a7a);
    color: white;
  }
  .tenant-table thead th {
    padding: 12px 16px;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
  }
  .tenant-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .tenant-table tbody tr:hover { background: #f8fafc; }
  .tenant-table tbody tr.paid-row { background: linear-gradient(135deg, #f0fdf4, #dcfce7); }
  .tenant-table tbody tr.paid-row:hover { background: linear-gradient(135deg, #dcfce7, #bbf7d0); }
  .tenant-table tbody tr.overdue-row { background: linear-gradient(135deg, #fff5f5, #fee2e2); }
  .tenant-table td {
    padding: 12px 16px;
    font-size: 0.9rem;
    text-align: center;
    vertical-align: middle;
  }
  .tenant-name { font-weight: 700; font-size: 0.95rem; text-align: right !important; }
  .apt-badge {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .amount-due {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .amount-due.zero { color: var(--success); }
  .amount-due.negative { color: var(--danger); }
  .amount-due.positive { color: var(--primary-light); }

  /* CHECKBOX / PAYMENT TOGGLE */
  .pay-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .pay-checkbox {
    width: 22px; height: 22px;
    cursor: pointer;
    accent-color: var(--success);
  }
  .pay-checkbox:disabled { cursor: not-allowed; opacity: 0.5; }

  /* STATUS BADGE */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .status-paid { background: var(--success-light); color: var(--success); }
  .status-due { background: var(--warning-light); color: var(--warning); }
  .status-overdue { background: var(--danger-light); color: var(--danger); }
  .status-empty { background: #f1f5f9; color: var(--text-muted); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    padding: 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h2 {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
  .modal-input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
    text-align: center;
    letter-spacing: 4px;
    direction: ltr;
    margin-bottom: 16px;
  }
  .modal-input:focus { border-color: var(--primary-light); }
  .modal-input.error { border-color: var(--danger); background: var(--danger-light); }
  .modal-error { color: var(--danger); font-size: 0.85rem; margin-bottom: 16px; display: none; }
  .modal-error.active { display: block; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-secondary {
    padding: 12px 20px;
    background: transparent;
    color: var(--text-muted);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* PAYMENT AMOUNT INPUT */
  .amount-input {
    width: 90px;
    padding: 6px 10px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.88rem;
    text-align: center;
    direction: ltr;
    outline: none;
    transition: border 0.2s;
  }
  .amount-input:focus { border-color: var(--primary-light); }
  .amount-input:disabled { background: #f1f5f9; cursor: not-allowed; }

  /* CONFIRM TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--primary);
    color: white;
    padding: 14px 28px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.95rem;
    box-shadow: var(--shadow-lg);
    z-index: 2000;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* MONTHLY MONTH HEADER */
  .month-hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: var(--radius);
    padding: 24px 30px;
    color: white;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .month-hero::after {
    content: '';
    position: absolute;
    top: -30px; left: -30px;
    width: 150px; height: 150px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  .month-hero-text h2 { font-size: 1.6rem; font-weight: 800; }
  .month-hero-text p { opacity: 0.75; font-size: 0.9rem; margin-top: 4px; }
  .month-hero-stats { display: flex; gap: 24px; }
  .hero-stat { text-align: center; }
  .hero-stat-value { font-size: 1.8rem; font-weight: 900; line-height: 1; }
  .hero-stat-label { font-size: 0.75rem; opacity: 0.75; margin-top: 3px; }

  /* EXPENSES SECTION */
  .expenses-list { padding: 4px 0; }
  .expense-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-item:hover { background: #f8fafc; }
  .expense-name { font-size: 0.9rem; font-weight: 500; }
  .expense-amount { font-weight: 700; color: var(--danger); font-size: 0.95rem; }
  .expense-doc { font-size: 0.78rem; color: var(--text-muted); background: #f1f5f9; padding: 2px 8px; border-radius: 10px; }

  /* LEDGER STATEMENT */
  .ledger-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .ledger-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .ledger-combined {
    border: 2px solid var(--accent);
  }
  .ledger-header {
    background: linear-gradient(135deg, var(--primary), #1e4a7a);
    color: white;
    padding: 13px 18px;
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ledger-combined .ledger-header {
    background: linear-gradient(135deg, #7c5c10, var(--accent));
  }
  .ledger-icon { font-size: 1.1rem; }
  .ledger-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 18px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.15s;
  }
  .ledger-row:hover { background: #fafbfc; }
  .ledger-open { background: #f8fafc; }
  .ledger-income { background: #f0fdf4; }
  .ledger-exp { background: #fff5f5; }
  .ledger-close {
    background: linear-gradient(135deg, #fffbeb, #fef9ee);
    border-bottom: none;
    padding: 14px 18px;
  }
  .ledger-label { font-size: 0.88rem; font-weight: 600; color: var(--text); }
  .ledger-amount { font-size: 0.95rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ledger-amount.neutral { color: var(--primary-light); }
  .ledger-amount.green { color: var(--success); }
  .ledger-amount.red { color: var(--danger); }
  .ledger-amount.gold { color: #b45309; }
  .ledger-total-val { font-size: 1.15rem; }
  .ledger-divider {
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 8px, transparent 8px, transparent 14px);
    margin: 0 18px;
  }
  .ledger-carry {
    padding: 7px 18px;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-style: italic;
    background: #f8fafc;
    border-top: 1px solid #f1f5f9;
    text-align: left;
  }

  .month-tab.annual-tab {
    color: var(--accent-light);
    border-right: 1px solid rgba(255,255,255,0.1);
    margin-right: 8px;
    padding-right: 20px;
    font-size: 0.9rem;
  }
  .month-tab.annual-tab.active {
    color: var(--accent-light);
    border-bottom-color: var(--accent);
    background: rgba(201,162,39,0.1);
  }

  /* ANNUAL DASHBOARD */
  .annual-hero {
    background: linear-gradient(135deg, #0f2744 0%, #1a3a5c 60%, #1e4a7a 100%);
    border-radius: var(--radius);
    padding: 30px 36px;
    color: white;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
  }
  .annual-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: white;
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    border-top: 4px solid transparent;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .kpi-blue  { border-top-color: var(--primary-light); }
  .kpi-green { border-top-color: var(--success); }
  .kpi-red   { border-top-color: var(--danger); }
  .kpi-gold  { border-top-color: var(--accent); }
  .kpi-teal  { border-top-color: #0d9488; }
  .kpi-purple{ border-top-color: #7c3aed; }
  .kpi-icon  { font-size: 1.8rem; flex-shrink: 0; }
  .kpi-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
  .kpi-value { font-size: 1.45rem; font-weight: 900; color: var(--text); line-height: 1; }
  .kpi-sub   { font-size: 0.73rem; color: var(--text-muted); margin-top: 5px; }

  .annual-charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 700px) {
    .annual-charts-grid { grid-template-columns: 1fr; }
  }

  .annual-bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) {
    .annual-bottom-grid { grid-template-columns: 1fr; }
  }

  /* Expense ranking bars */
  .exp-rank-row {
    display: grid;
    grid-template-columns: 1fr 120px 110px;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    border-bottom: 1px solid #f1f5f9;
  }
  .exp-rank-row:last-child { border-bottom: none; }
  .exp-rank-name { font-size: 0.83rem; font-weight: 600; color: var(--text); }
  .exp-rank-bar-wrap { height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
  .exp-rank-bar { height: 100%; background: linear-gradient(90deg, #ef4444, #dc2626); border-radius: 4px; transition: width 0.5s ease; }
  .exp-rank-nums { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .exp-rank-amt { font-size: 0.82rem; font-weight: 700; color: var(--danger); }
  .exp-rank-pct { font-size: 0.75rem; color: var(--text-muted); background: #f1f5f9; padding: 1px 6px; border-radius: 8px; }

  /* Tenant performance bars */
  .perf-row {
    display: grid;
    grid-template-columns: 160px 1fr 48px 80px;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f8fafc;
  }
  .perf-name { font-size: 0.82rem; font-weight: 700; }
  .perf-bar-wrap { height: 10px; background: #f1f5f9; border-radius: 5px; overflow: hidden; }
  .perf-bar { height: 100%; border-radius: 5px; transition: width 0.4s ease; }
  .perf-pct { font-size: 0.82rem; font-weight: 800; text-align: center; }
  .perf-gap { text-align: left; }

  /* Summary card kept for YTD cards */
  @media print {
    .header-actions, .month-nav, .modal-overlay, .toast { display: none !important; }
    .main { padding: 0; }
    .card { box-shadow: none; border: 1px solid #ddd; }
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .header-inner { padding: 12px 16px; }
    .main { padding: 16px; }
    .month-hero { flex-direction: column; gap: 16px; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .tenant-table { font-size: 0.82rem; }
    .tenant-table thead th, .tenant-table td { padding: 9px 10px; }
  }

  .lift-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 0.72rem; color: var(--primary-light);
    background: rgba(37,99,168,0.1);
    padding: 2px 7px; border-radius: 10px;
  }
  .empty-badge {
    font-size: 0.72rem; color: var(--text-muted);
    background: #f1f5f9;
    padding: 2px 7px; border-radius: 10px;
  }

  /* Apartment type badges */
  .apt-type-badge {

function openAddExpense() {
  const mName = mFull(MONTHS[currentMonth]);
  document.getElementById('expenseModalMonth').textContent =
    (lang === 'en' ? 'Adding expense for: ' : 'إضافة مصروف لشهر: ') + mName;
  document.getElementById('expAmount').value = '';
  document.getElementById('expDoc').value = '';
  document.getElementById('expName').value = '';

  // Build grouped dropdown
  const sel = document.getElementById('expPreset');
  if (sel) {
    sel.innerHTML = '<option value="">' + (lang === 'en' ? '— Select or type below —' : '— اختر أو اكتب أدناه —') + '</option>';
    let lastCat = '';
    EXPENSE_PRESETS.forEach(function(p) {
      if (p.category && p.category !== lastCat) {
        const og = document.createElement('optgroup');
        og.label = p.category;
        sel.appendChild(og);
        lastCat = p.category;
      }
      const opt = document.createElement('option');
      opt.value = lang === 'en' ? p.name_en : p.name_ar;
      opt.textContent = lang === 'en' ? p.name_en : p.name_ar;
      sel.appendChild(opt);
    });
    sel.onchange = function() {
      if (sel.value && sel.value !== (lang === 'en' ? 'Other (manual entry)' : 'أخرى (يدوي)')) {
        document.getElementById('expName').value = sel.value;
        document.getElementById('expName').style.display = 'none';
      } else if (sel.value === (lang === 'en' ? 'Other (manual entry)' : 'أخرى (يدوي)') || !sel.value) {
        document.getElementById('expName').value = '';
        document.getElementById('expName').style.display = 'block';
        document.getElementById('expName').focus();
      }
    };
  }
  document.getElementById('expName').style.display = 'block';
  document.getElementById('expenseModal').classList.add('active');
  setTimeout(() => document.getElementById('expAmount').focus(), 100);
}

function closeExpenseModal() {
  document.getElementById('expenseModal').classList.remove('active');
}

function saveExpense() {
  const preset = document.getElementById('expPreset').value;
  const manual = document.getElementById('expName').value.trim();
  const name   = preset && preset !== (lang === 'en' ? 'Other (manual entry)' : 'أخرى (يدوي)') ? preset : manual;
  const amount = parseFloat(document.getElementById('expAmount').value);
  const doc    = document.getElementById('expDoc').value.trim();
  if (!name) { showToast(t('expNameRequired'), 'error'); return; }
  if (!amount || amount <= 0) { showToast(t('expAmountRequired'), 'error'); return; }
  const mKey = getMonthKey(currentMonth);
  if (!customExpenses[mKey]) customExpenses[mKey] = [];
  customExpenses[mKey].push({ name, amount: -Math.abs(amount), doc, id: Date.now() });
  updateBalanceChain();
  saveCustomExpenses(customExpenses);
  closeExpenseModal();
  showToast(t('expAdded') + ': ' + name, 'success');
  renderAll();
}

function deleteExpense(mKey, expId) {
  if (!customExpenses[mKey]) return;
  const exp = customExpenses[mKey].find(e => e.id === expId);
  if (!exp) return;
  // Restore to FINANCIALS
  if (FINANCIALS[mKey]) FINANCIALS[mKey].expenses = (FINANCIALS[mKey].expenses || 0) + Math.abs(exp.amount);
  customExpenses[mKey] = customExpenses[mKey].filter(e => e.id !== expId);
  updateBalanceChain();
  saveCustomExpenses(customExpenses);
  showToast(t('expDeleted'), 'success');
  renderAll();
}

function updateBalanceChain() {
  // Rebuild FINANCIALS from BASE + custom expenses, maintaining prevBalance chain
  let prevMaint = BASE_FINANCIALS['jan'].prevBalance;
  let prevLift  = BASE_FINANCIALS['jan'].prevLift;
  MONTHS.forEach(function(m) {
    const base   = BASE_FINANCIALS[m.key];

    FINANCIALS[m.key].prevBalance  = prevMaint;
    FINANCIALS[m.key].prevLift     = prevLift;
    FINANCIALS[m.key].income       = base.income;
    FINANCIALS[m.key].expenses     = base.expenses + custTotal;
    FINANCIALS[m.key].liftIncome   = base.liftIncome;
    FINANCIALS[m.key].liftExpenses = base.liftExpenses;
    prevMaint = prevMaint + base.income + base.expenses + custTotal;
    prevLift  = prevLift  + base.liftIncome + base.liftExpenses;
  });
}

// Cumulative balance after month monthIdx (negative = still owes, positive = credit/overpaid)
// = opening balance + sum of (paid - fee) for each month up to monthIdx

function getMonthlyFee(tenant) {
  if (tenant.occupied) {
    return { maint: 500, lift: tenant.usesLift ? 100 : 0, total: tenant.usesLift ? 600 : 500 };
  } else {
    return { maint: tenant.usesLift ? 400 : 300, lift: 0, total: tenant.usesLift ? 400 : 300 };
  }
}

function getMonthPayment(monthKey, tenantId) {
  if (!payments[monthKey]) payments[monthKey] = {};
  return payments[monthKey][tenantId] || { maint: 0, lift: 0, paid: false };
}

function getCumulativeDue(tenantId, monthIdx) {
  const fee = getMonthlyFee(TENANTS.find(x => x.id === tenantId));
  let bal = OPENING_BALANCE[tenantId] || 0;
  for (let i = 0; i <= monthIdx; i++) {
    const maintPaid = (MONTHLY_MAINT_PAID[tenantId] || [])[i] || 0;
    const liftPaid  = (MONTHLY_LIFT_PAID[tenantId]  || [])[i] || 0;
    const adminPay  = payments[MONTHS[i].key] && payments[MONTHS[i].key][tenantId];
    const adminMaint = (adminPay && adminPay.paid) ? (adminPay.maint || 0) : 0;
    const adminLift  = (adminPay && adminPay.paid) ? (adminPay.lift  || 0) : 0;
    const totalPaid  = Math.max(maintPaid, adminMaint) + Math.max(liftPaid, adminLift);
    bal = bal - fee.total + totalPaid;
  }
  return bal;
}

// ============================================================
//  YTD CALCULATIONS
// ============================================================
function getYTDStats(upToMonthIdx) {
  let totalIncome = 0, totalExpenses = 0, totalLiftIncome = 0, totalLiftExpenses = 0;
  MONTHS.forEach((m, i) => {
    if (i > upToMonthIdx) return;
    const fin = FINANCIALS[m.key] || {};
    totalIncome      += (fin.income || 0);
    totalExpenses    += Math.abs(fin.expenses || 0);
    totalLiftIncome  += (fin.liftIncome || 0);
    totalLiftExpenses += Math.abs(fin.liftExpenses || 0);
  });
  const fin = FINANCIALS[MONTHS[upToMonthIdx].key] || {};
  const balance = (fin.prevBalance || 0) + (fin.income || 0) + (fin.expenses || 0);
  const liftBalance = (fin.prevLift || 0) + (fin.liftIncome || 0) + (fin.liftExpenses || 0);
  const startFin = FINANCIALS['jan'] || {};
  return { totalIncome, totalExpenses, totalLiftIncome, totalLiftExpenses,
           balance, liftBalance, startMaint: startFin.prevBalance || 0, startLift: startFin.prevLift || 0 };
}

// Tenant statement: total they should have paid YTD vs what's recorded
function getTenantStatement(tenantId, upToMonthIdx) {
  const tenant = TENANTS.find(x => x.id === tenantId);
  const fee = getMonthlyFee(t);
  let rows = [];
  let totalExpected = 0, totalPaid = 0;

  MONTHS.forEach((m, i) => {
    if (i > upToMonthIdx) return;
    const expected = fee.total;
    const pay = getMonthPayment(m.key, tenantId);
    const paidAmt = pay.paid ? (pay.maint + pay.lift) : 0;
    // Also factor historical due for that month
    const histDue = (HISTORICAL_DUE[tenantId] || [])[i] || 0;
    totalExpected += expected;
    totalPaid += paidAmt;
    rows.push({ month: m.label, expected, paidAmt, paid: pay.paid, histDue });
  });

  const balance = getCumulativeDue(tenantId, upToMonthIdx); // from historical Excel
  return { rows, totalExpected, totalPaid, balance };
}

function updatePayment(mKey, tenantId, field, value) {
  if (!payments[mKey]) payments[mKey] = {};
  if (!payments[mKey][tenantId]) payments[mKey][tenantId] = { maint: 0, lift: 0, paid: false };
  payments[mKey][tenantId][field] = parseFloat(value) || 0;
}

function togglePaid(mKey, tenantId, checked) {
  if (!payments[mKey]) payments[mKey] = {};
  if (!payments[mKey][tenantId]) {
    const tenant = TENANTS.find(x => x.id === tenantId);
    const fee = getMonthlyFee(t);
    payments[mKey][tenantId] = { maint: fee.maint, lift: fee.lift, paid: false };
  }
  payments[mKey][tenantId].paid = checked;

  // Read current input values
  const maintEl = document.getElementById(`maint_${tenantId}`);
  const liftEl = document.getElementById(`lift_${tenantId}`);
  if (maintEl) payments[mKey][tenantId].maint = parseFloat(maintEl.value) || 0;
  if (liftEl) payments[mKey][tenantId].lift = parseFloat(liftEl.value) || 0;

  saveState(payments);
  const tenant = TENANTS.find(x => x.id === tenantId);
  showToast(checked ? '✓ تم تسجيل دفع ' + TENANTS.find(x=>x.id===tenantId).name : 'تم إلغاء دفع ' + TENANTS.find(x=>x.id===tenantId).name, checked ? 'success' : '');
  renderAll();
}

function saveAll() {
  saveState(payments);
  showToast('✓ تم حفظ جميع التغييرات', 'success');
}

// ============================================================
//  TENANT STATEMENT — CORRECTED
// ============================================================
function showStatement(tenantId, upToMonthIdx) {
  var tenant = TENANTS.find(function(x) { return x.id === tenantId; });
  var fee = getMonthlyFee(t);
  var maintFee = fee.maint;
  var liftFee  = fee.lift;
  var totalFee = fee.total;

  var openingBal    = OPENING_BALANCE[tenantId] || 0;
  var runningBalance = openingBal;
  var totalExpected  = 0;
  var totalPaidAll   = 0;
  var rows = '';

  // Opening balance row (carried from previous years)
  if (openingBal !== 0) {
    var openBalDisplay = openingBal < 0
      ? '<span style="color:#dc2626;font-weight:700">' + Math.abs(openingBal).toLocaleString() + ' ج متأخر من سنوات سابقة</span>'
      : '<span style="color:#2563a8;font-weight:700">+ ' + openingBal.toLocaleString() + ' ج رصيد دائن</span>';
    rows += '<tr style="background:#fffbeb;border-bottom:2px solid #fde68a">'
      + '<td style="font-weight:800;color:#d97706">رصيد سابق</td>'
      + '<td colspan="3" style="color:#92400e;font-size:0.83rem">مرحّل من سنوات سابقة</td>'
      + '<td>' + openBalDisplay + '</td>'
      + '</tr>';
  }

  // Monthly rows
  MONTHS.slice(0, upToMonthIdx + 1).forEach(function(m, i) {
    var maintPaid = (MONTHLY_MAINT_PAID[tenantId] || [])[i] || 0;
    var liftPaid  = (MONTHLY_LIFT_PAID[tenantId]  || [])[i] || 0;
    var adminPay  = payments[m.key] && payments[m.key][tenantId];
    if (adminPay && adminPay.paid) {
      maintPaid = Math.max(maintPaid, adminPay.maint || 0);
      liftPaid  = Math.max(liftPaid,  adminPay.lift  || 0);
    }
    var paidThisMonth = maintPaid + liftPaid;

    runningBalance = runningBalance - totalFee + paidThisMonth;
    totalExpected += totalFee;
    totalPaidAll  += paidThisMonth;

    var isPaid    = paidThisMonth >= totalFee;
    var isPartial = paidThisMonth > 0 && paidThisMonth < totalFee;

    var statusCell;
    if (isPaid)         statusCell = '<span style="color:#16a34a;font-weight:700">&#10003; ' + t('stmtPaid2') + '</span>';
    else if (isPartial) statusCell = '<span style="color:#d97706;font-weight:700">' + t('partial') + '</span>';
    else                statusCell = '<span style="color:#dc2626;font-weight:700">&#9888; ' + t('notPaid') + '</span>';

    var balCell;
    if (runningBalance === 0)    balCell = '<span style="color:#16a34a;font-weight:700">' + t('paidFull2') + '</span>';
    else if (runningBalance < 0) balCell = '<span style="color:#dc2626;font-weight:700">' + Math.abs(runningBalance).toLocaleString() + ' ج ' + t('overdue') + '</span>';
    else                         balCell = '<span style="color:#2563a8;font-weight:700">+ ' + runningBalance.toLocaleString() + ' ج ' + t('credit') + '</span>';

    var paidDisplay = '';
    if (paidThisMonth > 0) {
      paidDisplay = maintPaid.toLocaleString();
      if (liftFee > 0) paidDisplay += ' + ' + liftPaid.toLocaleString();
      paidDisplay += ' ج';
    } else {
      paidDisplay = '<span style="color:#94a3b8">—</span>';
    }

    var rowBg = isPaid ? 'background:#f0fdf4' : isPartial ? 'background:#fffbeb' : runningBalance < 0 ? 'background:#fff5f5' : '';
    rows += '<tr style="' + rowBg + '">'
      + '<td style="font-weight:700">' + m.label + '</td>'
      + '<td>' + (liftFee > 0 ? maintFee + '+' + liftFee : maintFee) + ' ج</td>'
      + '<td style="font-weight:700">' + paidDisplay + '</td>'
      + '<td>' + statusCell + '</td>'
      + '<td>' + balCell + '</td>'
      + '</tr>';
  });

  var finalBal = runningBalance;
  var balSummary;
  if (finalBal === 0)      balSummary = '<span class="stmt-total-value green">مدفوع بالكامل &#10003;</span>';
  else if (finalBal < 0)   balSummary = '<span class="stmt-total-value red">' + Math.abs(finalBal).toLocaleString() + ' ج متأخر</span>';
  else                     balSummary = '<span class="stmt-total-value blue">+ ' + finalBal.toLocaleString() + ' ج رصيد</span>';

  var openingDisplay = openingBal === 0 ? 'لا يوجد' :
    (openingBal < 0 ? Math.abs(openingBal).toLocaleString() + ' ج متأخر' : '+' + openingBal.toLocaleString() + ' ج رصيد');

  var occupancyInfo = tenant.occupied
    ? ('ساكن' + (tenant.usesLift ? ' · مشترك أسانسير' : ' · بدون أسانسير'))
    : ('شاغر' + (tenant.usesLift ? ' · مشترك أسانسير' : ''));
  var feeDetail = liftFee > 0
    ? (maintFee + ' صيانة + ' + liftFee + ' أسانسير = ' + totalFee + ' ج/شهر')
    : (totalFee + ' ج/شهر صيانة');

  var modal = document.getElementById('stmtModal');
  if (!modal) return;
  modal.innerHTML =
    '<div class="stmt-header">'
    + '<h3>&#128196; ' + t('stmtTitle') + ' — ' + tenant.name + '</h3>'
    + '<p>شقة ' + tenant.apt + ' · ' + occupancyInfo + ' · ' + feeDetail + ' · حتى ' + MONTHS[upToMonthIdx].label + ' 2026</p>'
    + '</div>'
    + '<div class="stmt-totals">'
    + '<div class="stmt-total-item"><div class="stmt-total-label">رصيد مرحّل (سنوات سابقة)</div><div class="stmt-total-value ' + (openingBal < 0 ? 'red' : openingBal > 0 ? 'blue' : '') + '">' + openingDisplay + '</div></div>'
    + '<div class="stmt-total-item"><div class="stmt-total-label">مستحق 2026 (' + (upToMonthIdx+1) + ' شهر)</div><div class="stmt-total-value blue">' + totalExpected.toLocaleString() + ' ج</div></div>'
    + '<div class="stmt-total-item"><div class="stmt-total-label">إجمالي المدفوع 2026</div><div class="stmt-total-value green">' + totalPaidAll.toLocaleString() + ' ج</div></div>'
    + '<div class="stmt-total-item"><div class="stmt-total-label">الرصيد الإجمالي الحالي</div>' + balSummary + '</div>'
    + '</div>'
    + '<table class="stmt-table"><thead><tr><th>الشهر</th><th>المستحق</th><th>المدفوع</th><th>الحالة</th><th>الرصيد التراكمي</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>'
    + '<button class="stmt-close-btn" onclick="closeStatement()">' + t("stmtClose") + '</button>';

  document.getElementById('stmtOverlay').classList.add('active');
}

function renderAnnualDashboard() {
  // Compute full-year totals
  let ytdIncome = 0, ytdLiftIncome = 0, ytdExpenses = 0, ytdLiftExpenses = 0;
  const startBal = FINANCIALS['jan'].prevBalance;
  const startLift = FINANCIALS['jan'].prevLift;

  MONTHS.forEach(m => {
    const f = FINANCIALS[m.key] || {};
    ytdIncome     += (f.income || 0);
    ytdLiftIncome += (f.liftIncome || 0);
    ytdExpenses   += Math.abs(f.expenses || 0);
    ytdLiftExpenses += Math.abs(f.liftExpenses || 0);
  });
  const finDec = FINANCIALS['dec'];
  const endMaintBal = (finDec.prevBalance||0) + (finDec.income||0) + (finDec.expenses||0);
  const endLiftBal  = (finDec.prevLift||0) + (finDec.liftIncome||0) + (finDec.liftExpenses||0);

  // All expenses flat list for ranking
  const allExpenses = [];
  MONTHS.forEach(m => {
    (EXPENSES[m.key] || []).forEach(e => {
      if (e.amount < 0) {
        const found = allExpenses.find(x => x.name === e.name);
        if (found) found.total += Math.abs(e.amount);
        else allExpenses.push({ name: e.name, total: Math.abs(e.amount) });
      }
    });
  });
  allExpenses.sort((a, b) => b.total - a.total);
  const topExpenses = allExpenses.slice(0, 8);
  const maxExp = topExpenses[0]?.total || 1;

  // Monthly income chart data
  const monthlyIncomeSeries = MONTHS.map(m => {
    const f = FINANCIALS[m.key] || {};
    return (f.income||0) + (f.liftIncome||0);
  });
  const maxIncome = Math.max(...monthlyIncomeSeries, 1);

  // Monthly expenses chart data
  const monthlyExpSeries = MONTHS.map(m => {
    const f = FINANCIALS[m.key] || {};
    return Math.abs(f.expenses||0) + Math.abs(f.liftExpenses||0);
  });
  const maxBoth = Math.max(...monthlyIncomeSeries, ...monthlyExpSeries, 1);

  // Tenant collection performance
  const tenantPerf = TENANTS.map(t => {
    const fee = getMonthlyFee(t);
    let totalPaid = 0, totalExpected = 0;
    MONTHS.forEach((m, i) => {
      totalExpected += fee.total;
      totalPaid += (MONTHLY_PAID_AMOUNT[tp.id]||[])[i] || 0;
    });
    const pct = totalExpected > 0 ? Math.round(totalPaid / totalExpected * 100) : 0;
    return { ...t, fee, totalPaid, totalExpected, pct };
  }).sort((a, b) => a.pct - b.pct); // worst first

  const overdueTenantsHtml = tenantPerf.filter(tp => tp.pct < 100).map(tp => {
    const gap = tp.totalExpected - tp.totalPaid;
    return `<div class="perf-row">
      <div class="perf-name">${tp.name} <span class="apt-badge" style="font-size:0.7rem">${tp.apt}</span></div>
      <div class="perf-bar-wrap">
        <div class="perf-bar" style="width:${tp.pct}%;background:${tp.pct<50?'#ef4444':tp.pct<80?'#f59e0b':'#22c55e'}"></div>
      </div>
      <div class="perf-pct" style="color:${tp.pct<50?'#ef4444':tp.pct<80?'#d97706':'#16a34a'}">${tp.pct}%</div>
      <div class="perf-gap" style="color:#dc2626;font-size:0.8rem;font-weight:700">${gap > 0 ? gap.toLocaleString()+' ج' : ''}</div>
    </div>`;
  }).join('') || '<div style="padding:16px;color:#16a34a;font-weight:700;text-align:center">✓ جميع السكان ملتزمون بالسداد</div>';

  // Bar chart SVG helper
  const barChart = (series, labels, colorFn) => {
    const W = 560, H = 120, pad = 30, barW = Math.floor((W - pad*2) / series.length) - 4;
    const mx = Math.max(...series, 1);
    const bars = series.map((v, i) => {
      const x = pad + i * ((W - pad*2) / series.length) + 2;
      const bh = Math.round((v / mx) * (H - 20));
      const y = H - bh;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${colorFn(v, i)}"/>
        <text x="${x + barW/2}" y="${H+12}" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="Cairo">${labels[i]}</text>
        ${v > 0 ? `<text x="${x + barW/2}" y="${y-3}" text-anchor="middle" font-size="8" fill="#64748b" font-family="Cairo">${(v/1000).toFixed(0)}k</text>` : ''}`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto;overflow:visible">${bars}</svg>`;
  };

  const monthLabels = MONTHS.map(m => m.label.substring(0, 3));
  const incomeChart = barChart(monthlyIncomeSeries, monthLabels, () => '#22c55e');
  const expChart    = barChart(monthlyExpSeries, monthLabels, () => '#ef4444');

  // Pre-build sections to avoid nested template literal issues
  const topExpHtml = topExpenses.map(function(e) {
    const pct = Math.round(e.total / (ytdExpenses + ytdLiftExpenses) * 100);

      + '<div class="exp-rank-name">' + e.name + '</div>'

  const monthlyTableRows = MONTHS.map(function(m) {
    const f = FINANCIALS[m.key] || {};
    const openBal  = (f.prevBalance || 0) + (f.prevLift || 0);
    const inc      = (f.income || 0) + (f.liftIncome || 0);

  const fullyPaidCount = tenantPerf.filter(function(tp) { return tp.pct >= 100; }).length;
  const fullyPaidBanner = fullyPaidCount > 0
    ? '<div style="margin-top:12px;padding:10px 14px;background:#f0fdf4;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#16a34a;font-weight:700">&#10003; ' + fullyPaidCount + ' مستأجر ملتزم بالسداد الكامل</div>'

                <td>—</td>
                <td style="color:#86efac">+${(ytdIncome+ytdLiftIncome).toLocaleString()}</td>
                <td style="color:#fca5a5">-${(ytdExpenses+ytdLiftExpenses).toLocaleString()}</td>
                <td style="color:#fde68a">${(endMaintBal+endLiftBal).toLocaleString()}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">🏠</span> أداء التحصيل من السكان — ${activeMonthCount} أشهر</div>
        <div style="font-size:0.82rem;color:#64748b">الأقل التزاماً أولاً</div>
      </div>
      <div style="padding:12px 20px">
        ${overdueTenantsHtml}
        ${fullyPaidBanner}
      </div>
    </div>
  `;
}

function closeStatement(e) {
  if (!e || e.target === document.getElementById('stmtOverlay')) {
    document.getElementById('stmtOverlay')?.classList.remove('active');
  }
}

// Close modal on overlay click
document.getElementById('adminModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============================================================
//  TOAST
// ============================================================
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); }, 2800);
}

// ============================================================
//  INIT
// ============================================================
renderAll();
</script>
</body>
</html>
